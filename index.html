<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kentaevsky Phones</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  color: #171717;
  transition: 0.3s;
}

/* HEADER */

header {
  position: sticky;
  top: 0;
  z-index: 20;

  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(15px);

  padding: 14px 16px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom: 1px solid #ddd;
}

.logo {
  font-size: 21px;
  font-weight: bold;
}

#theme {
  width: 42px;
  height: 42px;

  border: 0;
  border-radius: 50%;

  background: #eee;

  font-size: 19px;
}

/* SEARCH */

.search-box {
  padding: 16px;
  background: white;
}

#search {
  width: 100%;

  padding: 15px 17px;

  border: 1px solid #ddd;
  border-radius: 12px;

  outline: none;

  font-size: 16px;
}

/* BRANDS */

.brands-title {
  padding: 18px 16px 8px;
  font-size: 18px;
  font-weight: bold;
}

.brands {
  padding: 8px 16px 16px;

  display: flex;
  gap: 8px;

  overflow-x: auto;

  background: white;
}

.brand-button {
  flex-shrink: 0;

  padding: 10px 15px;

  border: 1px solid #ddd;
  border-radius: 20px;

  background: white;

  font-size: 14px;
}

.brand-button.active {
  background: #111;
  color: white;
  border-color: #111;
}

/* CATALOG */

.catalog-title {
  padding: 20px 16px 5px;

  font-size: 22px;
  font-weight: bold;
}

#phones {
  padding: 12px 16px 30px;

  display: grid;

  grid-template-columns: repeat(2, minmax(0, 1fr));

  gap: 12px;
}

/* PHONE CARD */

.phone-card {
  background: white;

  border: 1px solid #e2e2e2;

  border-radius: 16px;

  padding: 12px;

  overflow: hidden;
}

.phone-photo {
  height: 170px;

  border-radius: 12px;

  background: linear-gradient(135deg, #eeeeee, #dcdcdc);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 48px;
}

.phone-name {
  margin-top: 12px;

  font-size: 17px;
  font-weight: bold;
}

.phone-brand {
  margin-top: 4px;

  font-size: 13px;

  color: #777;
}

.phone-rating {
  margin-top: 9px;

  font-size: 14px;
}

.phone-specs {
  margin-top: 9px;

  font-size: 12px;

  color: #666;

  line-height: 1.6;
}

.details-button {
  width: 100%;

  margin-top: 12px;

  padding: 10px;

  border: 0;
  border-radius: 10px;

  background: #111;
  color: white;

  font-size: 14px;
}

/* EMPTY */

#nothing {
  display: none;

  padding: 60px 20px;

  text-align: center;

  color: #777;
}

/* MODAL */

#modal {
  display: none;

  position: fixed;

  z-index: 100;

  inset: 0;

  padding: 20px;

  background: rgba(0,0,0,0.65);
}

.modal-box {
  max-width: 520px;

  max-height: 85vh;

  overflow-y: auto;

  margin: 40px auto;

  padding: 22px;

  border-radius: 20px;

  background: white;
}

.close-button {
  float: right;

  width: 36px;
  height: 36px;

  border: 0;
  border-radius: 50%;

  background: #eee;

  font-size: 20px;
}

.modal-photo {
  height: 220px;

  margin: 10px 0 20px;

  border-radius: 15px;

  background: linear-gradient(135deg,#eee,#ddd);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 60px;
}

.spec-row {
  padding: 12px 0;

  border-bottom: 1px solid #ddd;
}

.spec-name {
  font-size: 13px;
  color: #777;
}

.spec-value {
  margin-top: 4px;
  font-size: 16px;
  font-weight: bold;
}

/* DARK */

body.dark {
  background: #101010;
  color: white;
}

body.dark header,
body.dark .search-box,
body.dark .brands {
  background: #181818;
  border-color: #333;
}

body.dark #search {
  background: #252525;
  color: white;
  border-color: #444;
}

body.dark .brand-button {
  background: #222;
  color: white;
  border-color: #444;
}

body.dark .brand-button.active {
  background: white;
  color: black;
}

body.dark .phone-card {
  background: #1b1b1b;
  border-color: #333;
}

body.dark .phone-photo,
body.dark .modal-photo {
  background: linear-gradient(135deg,#292929,#1c1c1c);
}

body.dark .phone-brand,
body.dark .phone-specs {
  color: #aaa;
}

body.dark .details-button {
  background: white;
  color: black;
}

body.dark .modal-box {
  background: #1b1b1b;
}

body.dark .spec-row {
  border-color: #333;
}

body.dark .spec-name {
  color: #aaa;
}


/* PHONE ON SMALL SCREENS */

@media (max-width: 380px) {

  #phones {
    grid-template-columns: 1fr;
  }

}
</style>

/* =========================
   CURRENT FILTER
========================= */

let currentBrand = "Все";


/* =========================
   SHOW PHONES
========================= */

function showPhones(list) {

  const container =
    document.getElementById("phones");

  container.innerHTML = "";

  list.forEach(function(phone) {

    const card =
      document.createElement("div");

    card.className = "phone-card";

    card.innerHTML = `

      <div class="phone-photo">
        📱
      </div>

      <div class="phone-name">
        ${phone.name}
      </div>

      <div class="phone-brand">
        ${phone.brand}
      </div>

      <div class="phone-rating">
        ⭐ ${phone.rating}
      </div>

      <div class="phone-specs">

        📺 ${phone.screen}<br>

        ⚡ ${phone.chipset}<br>

        📸 ${phone.camera}<br>

        🔋 ${phone.battery}

      </div>

      <button
        class="details-button"
        onclick="openDetails('${phone.name}')">

        Подробнее

      </button>
    `;

    container.appendChild(card);

  });


  document.getElementById("nothing").style.display =
    list.length === 0 ? "block" : "none";
}


/* =========================
   SEARCH + FILTER
========================= */

function updateCatalog() {

  const text =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const result =
    phones.filter(function(phone) {

      const matchesText =
        phone.name
          .toLowerCase()
          .includes(text);

      const matchesBrand =
        currentBrand === "Все" ||
        phone.brand === currentBrand;

      return matchesText && matchesBrand;

    });


  showPhones(result);
}


/* =========================
   BRAND FILTER
========================= */

function selectBrand(brand, button) {

  currentBrand = brand;


  document
    .querySelectorAll(".brand-button")
    .forEach(function(btn) {

      btn.classList.remove("active");

    });


  button.classList.add("active");


  updateCatalog();
}


/* =========================
   DETAILS PAGE
========================= */

function openDetails(name) {

  const phone =
    phones.find(function(item) {

      return item.name === name;

    });


  if (!phone) return;


  document.getElementById("modalContent").innerHTML = `

    <div class="modal-photo">
      📱
    </div>

    <h2>${phone.name}</h2>

    <p>
      <b>Бренд:</b> ${phone.brand}
    </p>

    <p>
      ⭐ <b>Оценка:</b> ${phone.rating}/10
    </p>


    <div class="spec-row">

      <div class="spec-name">
        Экран
      </div>

      <div class="spec-value">
        ${phone.screen}
      </div>

    </div>


    <div class="spec-row">

      <div class="spec-name">
        Тип дисплея
      </div>

      <div class="spec-value">
        ${phone.display}
      </div>

    </div>


    <div class="spec-row">

      <div class="spec-name">
        Чипсет
      </div>

      <div class="spec-value">
        ${phone.chipset}
      </div>

    </div>


    <div class="spec-row">

      <div class="spec-name">
        Камера
      </div>

      <div class="spec-value">
        ${phone.camera}
      </div>

    </div>


    <div class="spec-row">

      <div class="spec-name">
        Батарея
      </div>

      <div class="spec-value">
        ${phone.battery}
      </div>

    </div>


    <div class="spec-row">

      <div class="spec-name">
        Оперативная память
      </div>

      <div class="spec-value">
        ${phone.ram}
      </div>

    </div>


    <div class="spec-row">

      <div class="spec-name">
        Память
      </div>

      <div class="spec-value">
        ${phone.storage}
      </div>

    </div>


    <div class="spec-row">

      <div class="spec-name">
        Операционная система
      </div>

      <div class="spec-value">
        ${phone.os}
      </div>

    </div>

  `;


  document.getElementById("modal").style.display =
    "block";
}


/* =========================
   CLOSE DETAILS
========================= */

function closeModal() {

  document.getElementById("modal").style.display =
    "none";
}


/* =========================
   DARK MODE
========================= */

function changeTheme() {

  document.body.classList.toggle("dark");


  const button =
    document.getElementById("theme");


  if (
    document.body.classList.contains("dark")
  ) {

    button.textContent = "☀️";

  } else {

    button.textContent = "🌙";

  }

}

showPhones(phones);
