.brand-button:active {

  transition:

}

.phone-rating {

.phone-specs {

.details-button {

/* =========================
CURRENT FILTER
========================= */

let currentBrand = "Все";

/* =========================
SHOW PHONES
========================= */

function showPhones(list) {

const container =
document.getElementById("phones");

container.innerHTML = "";

list.forEach(function(phone) {

const card =    
  document.createElement("div");    

card.className = "phone-card";    

card.innerHTML = `    

  <div class="phone-photo">
  ${phone.image
    ? `<img src="${phone.image}" alt="${phone.name}">`
    : "📱"}
</div>

  <div class="phone-name">    
    ${phone.name}    
  </div>    

  <div class="phone-brand">    
    ${phone.brand}    
  </div>    

  <div class="phone-rating">    
    ⭐ ${phone.rating}    
  </div>    

  <div class="phone-specs">    

    📺 ${phone.screen}<br>    

    ⚡ ${phone.chipset}<br>    

    📸 ${phone.camera}<br>    

    🔋 ${phone.battery}    

  </div>    

  <button    
    class="details-button"    
    onclick="openDetails('${phone.name}')">    

    Подробнее    

  </button>    
`;    

container.appendChild(card);

});

document.getElementById("nothing").style.display =
list.length === 0 ? "block" : "none";
}

/* =========================
SEARCH + FILTER
========================= */

function updateCatalog() {

const text =
document
.getElementById("search")
.value
.toLowerCase()
.trim();

const result =
phones.filter(function(phone) {

const matchesText =    
    phone.name    
      .toLowerCase()    
      .includes(text);    

  const matchesBrand =    
    currentBrand === "Все" ||    
    phone.brand === currentBrand;    

  return matchesText && matchesBrand;    

});

showPhones(result);
}

/* =========================
BRAND FILTER
========================= */

function selectBrand(brand, button) {

currentBrand = brand;

document
.querySelectorAll(".brand-button")
.forEach(function(btn) {

btn.classList.remove("active");    

});

button.classList.add("active");

updateCatalog();
}

/* =========================
DETAILS PAGE
========================= */

function openDetails(name) {

const phone =
phones.find(function(item) {

return item.name === name;    

});

if (!phone) return;

document.getElementById("modalContent").innerHTML = `

<div class="modal-photo">    
  📱    
</div>    

<h2>${phone.name}</h2>    

<p>    
  <b>Бренд:</b> ${phone.brand}    
</p>    

<p>    
  ⭐ <b>Оценка:</b> ${phone.rating}/10    
</p>    


<div class="spec-row">    

  <div class="spec-name">    
    Экран    
  </div>    

  <div class="spec-value">    
    ${phone.screen}    
  </div>    

</div>    


<div class="spec-row">    

  <div class="spec-name">    
    Тип дисплея    
  </div>    

  <div class="spec-value">    
    ${phone.display}    
  </div>    

</div>    


<div class="spec-row">    

  <div class="spec-name">    
    Чипсет    
  </div>    

  <div class="spec-value">    
    ${phone.chipset}    
  </div>    

</div>    


<div class="spec-row">    

  <div class="spec-name">    
    Камера    
  </div>    

  <div class="spec-value">    
    ${phone.camera}    
  </div>    

</div>    


<div class="spec-row">    

  <div class="spec-name">    
    Батарея    
  </div>    

  <div class="spec-value">    
    ${phone.battery}    
  </div>    

</div>    


<div class="spec-row">    

  <div class="spec-name">    
    Оперативная память    
  </div>    

  <div class="spec-value">    
    ${phone.ram}    
  </div>    

</div>    


<div class="spec-row">    

  <div class="spec-name">    
    Память    
  </div>    

  <div class="spec-value">    
    ${phone.storage}    
  </div>    

</div>    


<div class="spec-row">    

  <div class="spec-name">    
    Операционная система    
  </div>    

  <div class="spec-value">    
    ${phone.os}    
  </div>    

</div>

`;

document.getElementById("modal").style.display =
"block";
}

/* =========================
CLOSE DETAILS
========================= */

function closeModal() {

document.getElementById("modal").style.display =
"none";
}

/* =========================
DARK MODE
========================= */

function changeTheme() {

document.body.classList.toggle("dark");

const button =
document.getElementById("theme");

if (
document.body.classList.contains("dark")
) {

button.textContent = "☀️";

} else {

button.textContent = "🌙";

}

}
